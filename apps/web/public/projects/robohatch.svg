<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#190d2e" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <linearGradient id="rh-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#rh-bg)" />

  <!-- 3D Print Bed Grid Surface with Perspective -->
  <g stroke="#a855f7" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M 120 380 L 680 380 L 580 230 L 220 230 Z" fill="#120726" opacity="0.6" />
    <!-- Grid Crossbars on Bed -->
    <line x1="160" y1="380" x2="250" y2="230" />
    <line x1="220" y1="380" x2="290" y2="230" />
    <line x1="280" y1="380" x2="330" y2="230" />
    <line x1="340" y1="380" x2="370" y2="230" />
    <line x1="400" y1="380" x2="400" y2="230" />
    <line x1="460" y1="380" x2="430" y2="230" />
    <line x1="520" y1="380" x2="470" y2="230" />
    <line x1="580" y1="380" x2="510" y2="230" />
    <line x1="640" y1="380" x2="550" y2="230" />

    <line x1="140" y1="340" x2="660" y2="340" />
    <line x1="170" y1="300" x2="630" y2="300" />
    <line x1="200" y1="260" x2="600" y2="260" />
  </g>

  <!-- 3D Printed Geometric Artifact (Wireframe Polyhedron / Voronoi Model) -->
  <g stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.9">
    <!-- Base Polygon on Bed -->
    <polygon points="340,320 460,320 490,270 400,240 310,270" stroke="#a855f7" fill="#2e1065" opacity="0.4" />
    <!-- 3D Mesh Ribs -->
    <line x1="340" y1="320" x2="400" y2="160" stroke="#00f0ff" />
    <line x1="460" y1="320" x2="400" y2="160" stroke="#00f0ff" />
    <line x1="490" y1="270" x2="400" y2="160" stroke="#38bdf8" />
    <line x1="400" y1="240" x2="400" y2="160" stroke="#818cf8" />
    <line x1="310" y1="270" x2="400" y2="160" stroke="#c084fc" />

    <!-- Slicing Layer Rings -->
    <ellipse cx="400" cy="205" rx="50" ry="18" stroke="#c084fc" stroke-dasharray="4,2" />
    <ellipse cx="400" cy="250" rx="75" ry="24" stroke="#00f0ff" stroke-dasharray="4,2" />
    <ellipse cx="400" cy="295" rx="90" ry="28" stroke="#a855f7" stroke-dasharray="4,2" />
  </g>

  <!-- Extruder Toolhead (Active Printing Nozzle) -->
  <g transform="translate(400, 100)">
    <!-- Hotend Body -->
    <rect x="-24" y="-35" width="48" height="45" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <!-- Cooling Fan Grill -->
    <circle cx="0" cy="-12" r="14" fill="#0f0c29" stroke="#00f0ff" stroke-width="1" />
    <!-- Brass Nozzle -->
    <polygon points="-8,10 8,10 3,25 -3,25" fill="#f59e0b" stroke="#d97706" stroke-width="1" />
    <!-- Glowing Laser / Molten Filament Stream -->
    <line x1="0" y1="25" x2="0" y2="60" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="60" r="4" fill="#00f0ff" />
    <circle cx="0" cy="60" r="8" fill="#00f0ff" opacity="0.4" />
  </g>

  <!-- E-commerce Storefront HUD Overlay (Top Right) -->
  <g transform="translate(560, 40)">
    <rect width="200" height="85" rx="8" fill="#090514" stroke="#a855f7" stroke-width="1" opacity="0.9" />
    <circle cx="18" cy="22" r="4" fill="#c084fc" />
    <text x="30" y="26" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">Robohatch Store</text>
    <text x="18" y="46" fill="#94a3b8" font-family="monospace" font-size="9">CATALOG: 3D PRINTS</text>
    <text x="18" y="60" fill="#38bdf8" font-family="monospace" font-size="9">STACK: NEXTJS • NESTJS</text>
    <text x="18" y="74" fill="#22c55e" font-family="monospace" font-size="9">STATUS: DEPLOYED (VERCEL)</text>
  </g>

  <!-- Left Dimension Indicators -->
  <g transform="translate(50, 60)" font-family="monospace" font-size="10" fill="#94a3b8">
    <rect width="180" height="70" rx="6" fill="#090514" stroke="#1e1b4b" stroke-width="1" opacity="0.8" />
    <text x="14" y="24" fill="#00f0ff" font-weight="bold">3D FABRICATION ENGINE</text>
    <text x="14" y="42">Layer Height: 0.16mm</text>
    <text x="14" y="58">Infill: Gyroid 25%</text>
  </g>
</svg>
