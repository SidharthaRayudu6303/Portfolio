<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b03" />
      <stop offset="50%" stop-color="#241405" />
      <stop offset="100%" stop-color="#0a0502" />
    </linearGradient>
    <linearGradient id="sr-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sr-bg)" />

  <!-- Fleet Telemetry Grid Background -->
  <g stroke="#f59e0b" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Central Dashboard Workspace Frame -->
  <g transform="translate(140, 60)">
    <rect width="520" height="320" rx="16" fill="#1c0f05" stroke="#f59e0b" stroke-width="1.5" opacity="0.9" />

    <!-- Top Dashboard Header Bar -->
    <rect width="520" height="38" rx="16" fill="#291607" />
    <circle cx="20" cy="19" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="19" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="19" r="4.5" fill="#10b981" />
    <text x="75" y="23" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">CAT HACKATHON • SMART RENTAL DASHBOARD</text>

    <!-- Stat Metric Box 1: Fleet Utilization (Top-Left) -->
    <g transform="translate(24, 56)">
      <rect width="145" height="75" rx="8" fill="#140902" stroke="#f59e0b" stroke-width="1" opacity="0.8" />
      <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="9">ACTIVE FLEET</text>
      <text x="12" y="48" fill="#fbbf24" font-family="monospace" font-size="20" font-weight="bold">88.4%</text>
      <text x="12" y="64" fill="#10b981" font-family="monospace" font-size="8.5">▲ +12% Efficiency</text>
    </g>

    <!-- Stat Metric Box 2: Total Operating Hours (Top-Center) -->
    <g transform="translate(187, 56)">
      <rect width="145" height="75" rx="8" fill="#140902" stroke="#00f0ff" stroke-width="1" opacity="0.8" />
      <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="9">HOURS LOGGED</text>
      <text x="12" y="48" fill="#00f0ff" font-family="monospace" font-size="20" font-weight="bold">1,420h</text>
      <text x="12" y="64" fill="#38bdf8" font-family="monospace" font-size="8.5">Telematics Active</text>
    </g>

    <!-- Stat Metric Box 3: Predictive Maintenance Alerts (Top-Right) -->
    <g transform="translate(350, 56)">
      <rect width="145" height="75" rx="8" fill="#140902" stroke="#10b981" stroke-width="1" opacity="0.8" />
      <text x="12" y="22" fill="#94a3b8" font-family="monospace" font-size="9">EQUIPMENT HEALTH</text>
      <text x="12" y="48" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold">OPTIMAL</text>
      <text x="12" y="64" fill="#6ee7b7" font-family="monospace" font-size="8.5">0 Critical Faults</text>
    </g>

    <!-- Lower Dashboard Telemetry Graph -->
    <g transform="translate(24, 146)">
      <rect width="471" height="150" rx="10" fill="#140902" stroke="#291607" stroke-width="1" />
      <text x="16" y="24" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold">REAL-TIME EQUIPMENT UTILIZATION &amp; REVENUE TELEMETRY</text>

      <!-- Bar / Line Charts -->
      <g stroke="#f59e0b" stroke-width="2" fill="none">
        <path d="M 20 120 L 70 95 L 120 110 L 170 70 L 220 85 L 270 45 L 320 60 L 370 30 L 420 50 L 450 25" />
      </g>
      <!-- Area Glow Fill -->
      <polygon points="20,120 70,95 120,110 170,70 220,85 270,45 320,60 370,30 420,50 450,25 450,135 20,135" fill="url(#sr-amber)" opacity="0.15" />

      <!-- Horizontal Gridlines in Graph -->
      <line x1="20" y1="50" x2="450" y2="50" stroke="#f59e0b" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3" />
      <line x1="20" y1="90" x2="450" y2="90" stroke="#f59e0b" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,3" />
      <line x1="20" y1="130" x2="450" y2="130" stroke="#f59e0b" stroke-width="0.5" opacity="0.3" />
    </g>
  </g>

  <!-- Heavy Machinery / Excavator Silhouette Element (Bottom Right) -->
  <g transform="translate(670, 340)" stroke="#f59e0b" stroke-width="1.5" fill="#241405" opacity="0.8">
    <rect x="-30" y="-15" width="45" height="15" rx="3" />
    <circle cx="-18" cy="4" r="7" fill="#140902" stroke="#f59e0b" />
    <circle cx="2" cy="4" r="7" fill="#140902" stroke="#f59e0b" />
    <!-- Boom Arm -->
    <line x1="-10" y1="-15" x2="10" y2="-45" />
    <line x1="10" y1="-45" x2="35" y2="-20" />
    <polygon points="35,-20 48,-12 40,-5 30,-14" fill="#f59e0b" />
  </g>

  <!-- Bottom Overview Bar -->
  <rect x="220" y="405" width="360" height="26" rx="6" fill="#140902" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
  <text x="240" y="422" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="bold">CAT HACKATHON • REAL-TIME FLEET TELEMATICS</text>
</svg>

