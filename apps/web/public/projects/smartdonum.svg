<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02141a" />
      <stop offset="50%" stop-color="#042a38" />
      <stop offset="100%" stop-color="#010c10" />
    </linearGradient>
    <linearGradient id="sd-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sd-bg)" />

  <!-- Radial Network Nodes and Connection Lines -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.3" fill="none">
    <circle cx="400" cy="225" r="160" stroke-dasharray="6,4" />
    <circle cx="400" cy="225" r="90" stroke-dasharray="4,4" />
    <line x1="200" y1="120" x2="400" y2="225" />
    <line x1="600" y1="120" x2="400" y2="225" />
    <line x1="180" y1="320" x2="400" y2="225" />
    <line x1="620" y1="320" x2="400" y2="225" />
  </g>

  <!-- Central Hub: SmartDonum Heart & Handshake Empathic Shield -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="50" fill="#042a38" stroke="#00f0ff" stroke-width="2" />
    <!-- Heart & Care Vector -->
    <path d="M 0 -18 C -14 -32, -32 -16, -32 2 C -32 18, -12 30, 0 38 C 12 30, 32 18, 32 2 C 32 -16, 14 -32, 0 -18 Z" fill="url(#sd-cyan)" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Node 1: Donors (Top-Left) -->
  <g transform="translate(200, 120)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="#031f29" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-35" cy="0" r="12" fill="#00f0ff" opacity="0.3" />
    <text x="-16" y="-3" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">DONORS</text>
    <text x="-16" y="13" fill="#38bdf8" font-family="monospace" font-size="9">FOOD • BOOKS</text>
  </g>

  <!-- Node 2: Beneficiaries & Shelters (Top-Right) -->
  <g transform="translate(600, 120)">
    <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#031f29" stroke="#10b981" stroke-width="1.5" />
    <circle cx="-40" cy="0" r="12" fill="#10b981" opacity="0.3" />
    <text x="-20" y="-3" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">RECIPIENTS</text>
    <text x="-20" y="13" fill="#6ee7b7" font-family="monospace" font-size="9">COMMUNITY HUBS</text>
  </g>

  <!-- Node 3: Logistics & Inventory Tracking (Bottom-Left) -->
  <g transform="translate(180, 320)">
    <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#031f29" stroke="#38bdf8" stroke-width="1.2" />
    <text x="-50" y="-3" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">DISTRIBUTION</text>
    <text x="-50" y="13" fill="#94a3b8" font-family="monospace" font-size="9">REAL-TIME DISPATCH</text>
  </g>

  <!-- Node 4: Database & Verification (Bottom-Right) -->
  <g transform="translate(620, 320)">
    <rect x="-65" y="-30" width="130" height="60" rx="10" fill="#031f29" stroke="#10b981" stroke-width="1.2" />
    <text x="-50" y="-3" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">VERIFICATION</text>
    <text x="-50" y="13" fill="#6ee7b7" font-family="monospace" font-size="9">TRANSPARENT LEDGER</text>
  </g>

  <!-- Flowing Pulse Dots on Connections -->
  <circle cx="280" cy="165" r="4" fill="#00f0ff" />
  <circle cx="520" cy="165" r="4" fill="#10b981" />
  <circle cx="270" cy="280" r="4" fill="#38bdf8" />
  <circle cx="530" cy="280" r="4" fill="#10b981" />

  <!-- Bottom Overview Bar -->
  <rect x="250" y="400" width="300" height="28" rx="6" fill="#031f29" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
  <text x="270" y="418" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">DONATION &amp; BENEFICIARY MATCHING PLATFORM</text>
</svg>
