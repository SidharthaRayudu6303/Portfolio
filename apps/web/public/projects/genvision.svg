<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!---->
    <linearGradient id="gv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="gv-cloud" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#64748b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gv-ndvi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="75%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="gv-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="gv-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!---->
    <filter id="gv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gv-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!---->
  <rect width="1200" height="675" fill="url(#gv-bg)" />
  <rect width="1200" height="675" fill="url(#gv-grid)" />

  <!---->
  <circle cx="250" cy="300" r="280" fill="#00f0ff" fill-opacity="0.04" filter="url(#gv-glow)" />
  <circle cx="950" cy="340" r="300" fill="#3b82f6" fill-opacity="0.05" filter="url(#gv-glow)" />

  <!---->
  <rect x="30" y="30" width="1140" height="615" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 1170 70 L 1170 30 L 1130 30" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 30 605 L 30 645 L 70 645" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 1170 605 L 1170 645 L 1130 645" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!---->
  <rect x="50" y="50" width="1100" height="48" rx="8" fill="#0b1329" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
  <circle cx="75" cy="74" r="5" fill="#00f0ff" filter="url(#gv-glow)" />
  <text x="95" y="79" fill="#00f0ff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">GENVISION // MULTISPECTRAL SATELLITE IMAGE RESTORATION</text>
  <text x="780" y="79" fill="#64748b" font-family="monospace" font-size="12">SENSOR: SENTINEL-2 / LANDSAT-9</text>
  <rect x="1010" y="62" width="120" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
  <text x="1025" y="78" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">AI INPAINTING</text>

  <!---->
  <g transform="translate(50, 115)">
    <!---->
    <rect x="0" y="0" width="1100" height="440" rx="12" fill="#0d1b2a" />

    <!---->
    <!---->
    <polygon points="40,30 280,45 270,190 35,175" fill="#064e3b" stroke="#047857" stroke-width="1" />
    <!---->
    <polygon points="295,46 540,65 525,205 285,191" fill="#78350f" stroke="#b45309" stroke-width="1" />
    <!---->
    <polygon points="555,67 820,90 805,225 540,207" fill="#047857" stroke="#10b981" stroke-width="1" />
    <!---->
    <polygon points="835,92 1060,110 1045,245 820,227" fill="#14532d" stroke="#22c55e" stroke-width="1" />

    <!---->
    <polygon points="35,190 268,206 250,380 30,360" fill="#1e3a8a" stroke="#2563eb" stroke-width="1" opacity="0.4" />
    <polygon points="282,207 523,222 505,395 265,382" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <polygon points="538,223 803,241 785,410 520,397" fill="#166534" stroke="#4ade80" stroke-width="1" />
    <polygon points="818,242 1055,260 1035,425 800,412" fill="#0f766e" stroke="#14b8a6" stroke-width="1" />

    <!---->
    <path d="M 268 206 Q 275 300 250 380 Q 220 440 200 440" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 525 205 Q 515 280 505 395" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4,4" />

    <!---->
    <g>
      <clipPath id="left-clip">
        <rect x="0" y="0" width="550" height="440" />
      </clipPath>
      <g clip-path="url(#left-clip)">
        <!---->
        <path d="M 60 80 Q 120 20 220 50 Q 320 10 380 80 Q 450 120 420 200 Q 480 260 410 320 Q 320 380 220 340 Q 120 390 70 310 Q 10 240 40 160 Z" fill="url(#gv-cloud)" filter="url(#gv-glow)" opacity="0.94" />
        <path d="M 280 180 Q 360 130 450 160 Q 520 210 490 290 Q 420 360 340 330 Q 260 300 280 180 Z" fill="url(#gv-cloud)" filter="url(#gv-glow)" opacity="0.88" />

        <!---->
        <ellipse cx="280" cy="280" rx="140" ry="80" fill="#020617" opacity="0.65" />

        <!---->
        <rect x="30" y="20" width="220" height="60" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5" />
        <text x="45" y="42" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">● OCCLUDED REGION</text>
        <text x="45" y="62" fill="#94a3b8" font-family="monospace" font-size="10">CLOUD DENSITY: 78.4%</text>
        <text x="45" y="74" fill="#64748b" font-family="monospace" font-size="9">SURFACE DATA IRRETRIEVABLE</text>
      </g>
    </g>

    <!---->
    <g>
      <clipPath id="right-clip">
        <rect x="550" y="0" width="550" height="440" />
      </clipPath>
      <g clip-path="url(#right-clip)">
        <!---->
        <rect x="560" y="70" width="240" height="135" fill="url(#gv-ndvi)" opacity="0.35" />
        <rect x="825" y="95" width="220" height="130" fill="url(#gv-ndvi)" opacity="0.45" />

        <!---->
        <rect x="590" y="90" width="160" height="100" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />
        <rect x="590" y="72" width="130" height="18" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1" />
        <text x="596" y="85" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold">PARCEL #48A: 98.4% HEALTH</text>

        <rect x="840" y="115" width="180" height="110" fill="none" stroke="#22c55e" stroke-width="1.5" />
        <rect x="840" y="97" width="125" height="18" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
        <text x="846" y="110" fill="#4ade80" font-family="monospace" font-size="9" font-weight="bold">INPAINTED CANOPY CONF: 96.2%</text>

        <!---->
        <rect x="860" y="20" width="210" height="60" rx="6" fill="#022c22" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5" />
        <text x="875" y="42" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">✓ DIFFUSION RECONSTRUCTED</text>
        <text x="875" y="60" fill="#6ee7b7" font-family="monospace" font-size="10">SSIM: 0.942 | PSNR: 32.8 dB</text>
        <text x="875" y="72" fill="#34d399" font-family="monospace" font-size="9">FULL CANOPY SPECTRA RESTORED</text>
      </g>
    </g>

    <!---->
    <line x1="550" y1="0" x2="550" y2="440" stroke="#00f0ff" stroke-width="3" filter="url(#gv-glow)" />
    <line x1="550" y1="0" x2="550" y2="440" stroke="#ffffff" stroke-width="1" />

    <!---->
    <circle cx="550" cy="220" r="22" fill="#0b1329" stroke="#00f0ff" stroke-width="2" filter="url(#gv-glow)" />
    <path d="M 542 220 L 558 220 M 550 212 L 550 228" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <rect x="490" y="250" width="120" height="22" rx="4" fill="#0b1329" stroke="#00f0ff" stroke-width="1" />
    <text x="502" y="265" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">AI TENSOR SPLIT</text>
  </g>

  <!---->
  <g transform="translate(50, 575)">
    <rect x="0" y="0" width="1100" height="48" rx="8" fill="#0b1329" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="28" fill="#94a3b8" font-family="monospace" font-size="11">MODEL: <tspan fill="#00f0ff">Severity-Aware Transformer-Diffusion</tspan></text>
    <text x="440" y="28" fill="#94a3b8" font-family="monospace" font-size="11">BANDS: <tspan fill="#38bdf8">B2 (Blue), B3 (Green), B4 (Red), B8 (NIR)</tspan></text>
    <text x="830" y="28" fill="#94a3b8" font-family="monospace" font-size="11">RESOLUTION: <tspan fill="#38bdf8">Sentinel-2 MSI (10m Spatial)</tspan></text>
  </g>
</svg>
