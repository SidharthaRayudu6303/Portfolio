<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="as-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1f" />
      <stop offset="50%" stop-color="#08203e" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>
    <linearGradient id="as-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#as-bg)" />

  <!-- Digital Healthcare Frequency Waves in Background -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.25" fill="none">
    <path d="M 0 225 Q 100 180 200 225 T 400 225 T 600 225 T 800 225" />
    <path d="M 0 225 Q 100 260 200 225 T 400 225 T 600 225 T 800 225" />
    <path d="M 0 225 Q 100 140 200 225 T 400 225 T 600 225 T 800 225" opacity="0.15" />
  </g>

  <!-- Main Digital Assessment Interface Frame -->
  <g transform="translate(160, 80)">
    <rect width="480" height="280" rx="16" fill="#041226" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

    <!-- Top Window Bar -->
    <rect width="480" height="36" rx="16" fill="#061c3b" />
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4.5" fill="#10b981" />
    <text x="75" y="22" fill="#93c5fd" font-family="monospace" font-size="11">Autism Screening Platform • Interface Assessment</text>

    <!-- Assessment Card 1: Facial / Eye Gaze Video Stream (Left) -->
    <g transform="translate(24, 56)">
      <rect width="200" height="190" rx="10" fill="#08203e" stroke="#00f0ff" stroke-width="1" opacity="0.8" />
      <!-- Stylized Camera Tracking Box -->
      <circle cx="100" cy="80" r="42" fill="#030914" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,2" />
      <circle cx="100" cy="80" r="28" fill="#0c4a6e" opacity="0.4" />
      <!-- Gaze Tracking Nodes -->
      <circle cx="90" cy="74" r="3" fill="#00f0ff" />
      <circle cx="110" cy="74" r="3" fill="#00f0ff" />
      <path d="M 92 92 Q 100 98 108 92" stroke="#00f0ff" stroke-width="1.5" fill="none" />
      <!-- Camera HUD -->
      <rect x="15" y="145" width="170" height="26" rx="4" fill="#030914" opacity="0.9" />
      <text x="25" y="162" fill="#38bdf8" font-family="monospace" font-size="9">CAMERA: ACTIVE RECORDING</text>
    </g>

    <!-- Assessment Card 2: Metrics & Media Evaluation (Right) -->
    <g transform="translate(244, 56)">
      <rect width="210" height="190" rx="10" fill="#08203e" stroke="#818cf8" stroke-width="1" opacity="0.8" />
      <text x="16" y="25" fill="#c7d2fe" font-family="monospace" font-size="11" font-weight="bold">ASSESSMENT TELEMETRY</text>

      <!-- Progress Meter -->
      <rect x="16" y="42" width="178" height="6" rx="3" fill="#1e293b" />
      <rect x="16" y="42" width="128" height="6" rx="3" fill="url(#as-wave)" />

      <!-- Checklist Points -->
      <g transform="translate(16, 68)" font-family="monospace" font-size="9" fill="#93c5fd">
        <circle cx="4" cy="4" r="3" fill="#10b981" />
        <text x="14" y="8">Response Latency: 240ms</text>

        <circle cx="4" cy="28" r="3" fill="#10b981" />
        <text x="14" y="32">Visual Engagement: 88%</text>

        <circle cx="4" cy="52" r="3" fill="#38bdf8" />
        <text x="14" y="56">Video Upload: Verified</text>

        <circle cx="4" cy="76" r="3" fill="#818cf8" />
        <text x="14" y="80">Questionnaire: Complete</text>
      </g>
    </g>
  </g>

  <!-- Non-Clinical Screening Evaluation Banner (Bottom) -->
  <g transform="translate(200, 395)">
    <rect width="400" height="26" rx="6" fill="#030e1f" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="24" y="17" fill="#93c5fd" font-family="monospace" font-size="9.5">ASSESSMENT INTERFACE • MEDIA SUBMISSION PORTAL</text>
  </g>
</svg>

